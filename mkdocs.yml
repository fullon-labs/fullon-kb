        palette:
        - scheme: default
          primary: teal
          accent: cyan
          toggle:
            icon: material/brightness-7
            name: Switch to dark mode
        - scheme: slate
          primary: teal
          accent: cyan
          toggle:
            icon: material/brightness-4
            name: Switch to light mode
- search:
    lang:
    - en
    - zh
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.superfences
extra_css:
