site_name: FullOn 文档中心
site_description: FullOn 用户、开发者与节点运维指南
site_url: https://fullon-labs.github.io/fullon-kb/
repo_url: https://github.com/fullon-labs/fullon-kb
repo_name: fullon-labs/fullon-kb
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: 'index.html

  06_User_Guides/guide-template.md

  07_DApps/dapp-template.md

  '
theme:
  name: material
  language: zh
  font: false
  palette:
  - scheme: default
    primary: teal
    accent: cyan
    toggle:
      icon: material/brightness-7
      name: 切换深色模式
  - scheme: slate
    primary: teal
    accent: cyan
    toggle:
      icon: material/brightness-4
      name: 切换浅色模式
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - navigation.footer
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.action.edit
plugins:
- i18n:
    docs_structure: suffix
    fallback_to_default: true
    languages:
    - locale: zh
      name: 简体中文
      default: true
    - locale: en
      name: English
      site_name: FullOn Documentation
      site_description: FullOn user, developer, and node operator guides
      nav_translations:
