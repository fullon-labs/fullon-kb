site_name: FullOn 文档中心
site_description: FullOn 用户、开发者与节点运维指南
site_url: https://fullon-labs.github.io/fullon-kb/
repo_url: https://github.com/fullon-labs/fullon-kb
repo_name: fullon-labs/fullon-kb
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: 'index.html

  06_User_Guides/guide-template.md

  07_DApps/dapp-template.md

  '
theme:
  name: material
  language: zh
  font: false
  palette:
  - scheme: default
    primary: teal
    accent: cyan
    toggle:
      icon: material/brightness-7
      name: 切换深色模式
  - scheme: slate
    primary: teal
    accent: cyan
    toggle:
      icon: material/brightness-4
      name: 切换浅色模式
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - navigation.footer
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.action.edit
plugins:
- i18n:
    docs_structure: suffix
    fallback_to_default: true
    languages:
    - locale: zh
      name: 简体中文
      default: true
    - locale: en
      name: English
      site_name: FullOn Documentation
      site_description: FullOn user, developer, and node operator guides
      nav_translations:
        首页: Home
        通用概念: Core concepts
        概览: Overview
        FullOn 账户: FullOn accounts
        RWID 账户: RWID accounts
        区块链规格: Specifications
        网络与入口: Networks and entry points
        FullOn 是什么: What is FullOn?
        账户类型: Account types
        资源模型: Resource model
        代币经济: Tokenomics
        虚拟机: Virtual machine
        互操作性: Interoperability
        官方 FAQ 合并说明: Official FAQ integration
        用户指南: User guides
        阅读路线: Reading path
        新手入门: Getting started
        开通账户: Create an account
        手机钱包与 HuFu: HuFu mobile wallet
        收发资产: Transfer assets
        参与 DApp: Use DApps
        FullSwap 兑换: FullSwap trading
        交易查询: Transaction status
        排错与求助: Troubleshooting and support
        开发者指南: Developer guides
        RPC 快速开始: RPC quickstart
        获取 ABI 与 code: Get ABI and code
        创建与激活账户: Create and activate accounts
        签名与交易确认: Signing and confirmation
        普通节点与 BP: Common nodes and BPs
        合约开发路线: Contract development path
        编写与编译合约: Build a contract
        部署合约: Deploy a contract
        调用动作: Call actions
        发行代币: Issue tokens
        接入排错: Integration troubleshooting
        RPC 参考: RPC reference
        导航: Reference index
        完整 RPC: Complete RPC reference
        交易历史: Transaction history
        生态: Ecosystems
        生态概览: Ecosystem overview
        维护: Maintenance
        来源与核验: Sources and verification
        文档维护与发布: Maintain and publish
        Docker Compose 部署: Docker Compose deployment
        v0.9.2 版本与升级: v0.9.2 baseline and migration
      theme:
        palette:
        - scheme: default
          primary: teal
          accent: cyan
          toggle:
            icon: material/brightness-7
            name: Switch to dark mode
        - scheme: slate
          primary: teal
          accent: cyan
          toggle:
            icon: material/brightness-4
            name: Switch to light mode
- search:
    lang:
    - en
    - zh
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.superfences
extra_css:
- assets/stylesheets/extra.css
nav:
- 首页: index.md
- 通用概念:
  - 概览: 01_Core_Chain/chain-overview.md
  - FullOn 账户: 01_Core_Chain/accounts.md
  - RWID 账户: 01_Core_Chain/rwid-accounts.md
  - 区块链规格: 01_Core_Chain/specifications.md
  - 网络与入口: 01_Core_Chain/network.md
  - FAQ: 04_FAQ/README.md
  - FullOn 是什么: 04_FAQ/what-is-fullon.md
  - 账户类型: 04_FAQ/account-types.md
  - 资源模型: 04_FAQ/resource-model.md
  - 代币经济: 04_FAQ/tokenomics.md
  - 虚拟机: 04_FAQ/vm.md
  - 互操作性: 04_FAQ/interoperability.md
  - 官方 FAQ 合并说明: 04_FAQ/official-faq.md
- 用户指南:
  - 阅读路线: 06_User_Guides/README.md
  - 新手入门: 06_User_Guides/getting-started.md
  - 开通账户: 06_User_Guides/create-account.md
  - 手机钱包与 HuFu: 06_User_Guides/hufu-mobile.md
  - 收发资产: 06_User_Guides/transfer-token.md
  - 参与 DApp: 06_User_Guides/use-dapps.md
  - FullSwap 兑换: 06_User_Guides/fullswap.md
  - 交易查询: 06_User_Guides/transaction-status.md
  - 排错与求助: 06_User_Guides/troubleshooting.md
- 开发者指南:
  - 阅读路线: 10_Developer_Guides/README.md
  - RPC 快速开始: 10_Developer_Guides/quickstart.md
  - 获取 ABI 与 code: 10_Developer_Guides/get-abi-code.md
  - 创建与激活账户: 10_Developer_Guides/accounts.md
  - 签名与交易确认: 10_Developer_Guides/transactions.md
  - Docker Compose 部署: 10_Developer_Guides/docker-compose.md
  - 普通节点与 BP: 10_Developer_Guides/nodes.md
  - P2P: 10_Developer_Guides/p2p.md
  - 合约开发路线: 10_Developer_Guides/contracts.md
  - 编写与编译合约: 10_Developer_Guides/build-contract.md
  - 部署合约: 10_Developer_Guides/deploy-contract.md
  - 调用动作: 10_Developer_Guides/call-actions.md
  - 发行代币: 10_Developer_Guides/issue-tokens.md
  - 接入排错: 10_Developer_Guides/troubleshooting.md
- RPC 参考:
  - 导航: 03_Operators/README.md
  - 完整 RPC: 03_Operators/funod-rpc.md
  - 交易历史: 03_Operators/transaction-history-rpc.md
- 生态:
  - 生态概览: 02_Ecosystems/README.md
  - Web3: 02_Ecosystems/web3.md
  - AI: 02_Ecosystems/ai.md
  - Social: 02_Ecosystems/social.md
  - HuFu Wallet: 02_Ecosystems/hufu-wallet.md
  - FullSwap: 07_DApps/fullswap.md
  - FullBridge: 07_DApps/fullbridge.md
  - FullVest: 07_DApps/fullvest.md
  - RWAVerse: 07_DApps/rwaverse.md
- 维护:
  - v0.9.2 版本与升级: 09_Release_Notes/v0.9.2.md
  - 来源与核验: contributing/sources.md
  - 文档维护与发布: contributing/publishing.md
hooks:
- scripts/docs_hooks.py
